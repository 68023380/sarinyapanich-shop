<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายละเอียดสินค้า - ศริณญาพานิช</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="ui-enhancements.css">
<style>
.header-bar{max-width:900px;margin:2rem auto 1rem;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;background:var(--white);border:1px solid var(--border-color);border-radius:var(--radius-lg);box-shadow:var(--shadow-soft)}.logo-container{display:flex;align-items:center;gap:.8rem}.store-logo{width:45px;height:45px;object-fit:cover;border-radius:50%;border:2px solid var(--primary-red)}.header-actions{display:flex;gap:.6rem;flex-wrap:wrap}.header-btn{display:inline-flex;align-items:center;justify-content:center;min-width:100px;padding:.55rem .9rem;border-radius:var(--radius-md);color:#fff;text-decoration:none;font-family:'Kanit',sans-serif;font-weight:600}.home-btn{background:var(--primary-red)}.cart-btn{background:#475569}.detail-container{max-width:900px;margin:0 auto 2rem;padding:2rem;background:var(--white);border:1px solid var(--border-color);border-radius:var(--radius-lg);box-shadow:var(--shadow-soft)}.back-link{display:inline-block;margin-bottom:1.2rem;color:var(--primary-red);text-decoration:none;font-weight:600}.product-detail{display:grid;grid-template-columns:minmax(240px,1fr) minmax(280px,1.2fr);gap:2rem;align-items:start}.product-visual{min-height:300px;display:flex;align-items:center;justify-content:center;background:#f8fafc;border:1px solid var(--border-color);border-radius:var(--radius-lg);overflow:hidden}.product-emoji{font-size:8rem}.product-image{width:100%;height:300px;object-fit:cover}.product-category{display:inline-block;padding:.3rem .75rem;border-radius:50px;background:#fee2e2;color:var(--primary-red);font-size:.82rem;font-weight:600}.product-name{margin:.8rem 0 .4rem;color:var(--text-dark);font-size:1.8rem}.product-price{color:var(--primary-red);font-size:1.6rem;font-weight:700;margin-bottom:.5rem}.product-description{color:var(--text-muted);line-height:1.7;margin-bottom:1.2rem}.info-box{padding:1rem;margin-bottom:1.2rem;background:#f8fafc;border:1px solid var(--border-color);border-radius:var(--radius-md)}.info-box h3{color:var(--text-dark);font-size:1rem;margin-bottom:.5rem}.info-box p,.info-box li{color:var(--text-muted);font-size:.9rem;line-height:1.7}.info-box ul{margin:0;padding-left:1.2rem}.purchase-row{display:flex;gap:.7rem;align-items:center}.quantity-input{width:76px;padding:.7rem .5rem;text-align:center;border:1px solid var(--border-color);border-radius:var(--radius-md);font-family:'Kanit',sans-serif;font-size:1rem}.add-button{flex:1;padding:.75rem 1rem;border:0;border-radius:var(--radius-md);background:var(--primary-red);color:#fff;font-family:'Kanit',sans-serif;font-size:1rem;font-weight:600;cursor:pointer}.add-button:disabled{opacity:.6;cursor:wait}@media(max-width:650px){.header-bar{margin:1rem;padding:.9rem 1rem;flex-direction:column;align-items:stretch}.logo-container{justify-content:center}.header-actions{width:100%}.header-btn{flex:1}.detail-container{margin:0 1rem 1.5rem;padding:1.2rem}.product-detail{grid-template-columns:1fr;gap:1.2rem}.product-visual{min-height:220px}.product-image{height:220px}.product-name{font-size:1.5rem}}
</style>
</head>
<body>
<div class="header-bar"><div class="logo-container"><img src="pic/Logo.webp" alt="โลโก้" class="store-logo" onerror="this.onerror=null;this.src='Logo.webp';"><h1 style="color:var(--primary-red);font-size:1.3rem;margin:0;white-space:nowrap;">ศริณญาพานิช 🛒</h1></div><nav class="header-actions"><a href="index.html" class="header-btn home-btn">⌂ หน้าแรก</a><a href="cart.html" class="header-btn cart-btn">🛒 ตะกร้า</a></nav></div>
<main class="detail-container"><a href="index.html" class="back-link">← กลับไปเลือกซื้อสินค้า</a><div id="productDetail"><div class="neo-loading" style="height:300px"></div></div></main>
<div id="customAlertModal" class="modal-overlay" style="display:none"><div class="modal-card" style="text-align:center"><h3 id="alertTitle" style="margin-bottom:.8rem;color:var(--primary-red)">แจ้งเตือน</h3><p id="alertMessage" style="color:var(--text-dark);margin-bottom:1.5rem;white-space:pre-line"></p><button class="btn-primary" onclick="closeAlertModal()">ตกลง</button></div></div>
<script src="js/api.js"></script><script>
let product=null;
const categoryNames={grain:'ข้าวและธัญพืช',oil:'เครื่องปรุง/น้ำมัน',fresh:'ไข่และอาหารสด',canned:'อาหารกระป๋อง'};
function escapeHtml(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function showAlert(title,message){document.getElementById('alertTitle').textContent=title;document.getElementById('alertMessage').textContent=message;document.getElementById('customAlertModal').style.display='flex'}
function closeAlertModal(){document.getElementById('customAlertModal').style.display='none'}
function mediaUrl(value){if(!value)return '';if(/^https?:\/\//i.test(value))return value;const origin=API_BASE_URL.replace(/\/api\/?$/,'');return `${origin}${value.startsWith('/')?value:`/${value}`}`}
function visual(p){const image=p.image||'';if(image.startsWith('http')||image.startsWith('/uploads/'))return `<img class="product-image" src="${escapeHtml(mediaUrl(image))}" alt="${escapeHtml(p.name)}">`;return `<span class="product-emoji">${escapeHtml(image||'🛒')}</span>`}
function renderProduct(p){const details=Array.isArray(p.details)?p.details:[];document.getElementById('productDetail').innerHTML=`<div class="product-detail"><div class="product-visual">${visual(p)}</div><section><span class="product-category">${escapeHtml(categoryNames[p.category]||p.category||'สินค้า')}</span><h2 class="product-name">${escapeHtml(p.name)}</h2><div class="product-price">฿${Number(p.price).toLocaleString('th-TH')}</div><div style="color:var(--text-muted);margin-bottom:1rem">คงเหลือ ${Number(p.stock||0).toLocaleString('th-TH')} ชิ้น</div><p class="product-description">${escapeHtml(p.description||'รายละเอียดสินค้าจะแสดงที่นี่')}</p><div class="info-box"><h3>ส่วนประกอบ</h3><p>${escapeHtml(p.ingredients||'ไม่ระบุ')}</p></div><div class="info-box"><h3>ข้อมูลเพิ่มเติม</h3><ul>${details.map(x=>`<li>${escapeHtml(x)}</li>`).join('')||'<li>ไม่มีข้อมูลเพิ่มเติม</li>'}</ul></div><div class="purchase-row"><input id="quantity" class="quantity-input" type="number" min="1" max="${Math.max(1,Number(p.stock||1))}" value="1"><button id="addButton" class="add-button" onclick="addToCart()">เพิ่มลงตะกร้า 🛒</button></div></section></div>`}
async function loadProduct(){const id=Number(new URLSearchParams(location.search).get('id'));if(!Number.isInteger(id)||id<1){document.getElementById('productDetail').innerHTML='<p>รหัสสินค้าไม่ถูกต้อง</p>';return}try{product=await getProduct(id);renderProduct(product)}catch(e){document.getElementById('productDetail').innerHTML=`<div style="text-align:center;padding:3rem"><h2 style="color:var(--primary-red)">ไม่พบสินค้านี้</h2><p>${escapeHtml(e.message)}</p><a href="index.html" class="back-link">กลับหน้าแรก</a></div>`}}
async function addToCart(){if(!isLoggedIn()){showAlert('กรุณาเข้าสู่ระบบ','กรุณาเข้าสู่ระบบก่อนเพิ่มสินค้าลงตะกร้า');return}const quantity=Math.max(1,Number(document.getElementById('quantity').value||1));const button=document.getElementById('addButton');button.disabled=true;try{const cart=await getCart();const old=cart.find(x=>Number(x.id)===Number(product.id));const newQty=Number(old?.quantity||0)+quantity;await updateCartItem(product.id,newQty);showAlert('เพิ่มสินค้าสำเร็จ 🛒',`เพิ่ม ${product.name} จำนวน ${quantity} ชิ้นแล้ว`)}catch(e){showAlert('เพิ่มสินค้าไม่สำเร็จ',e.message)}finally{button.disabled=false}}
loadProduct();
</script><script src="ui-enhancements.js"></script>
</body></html>
